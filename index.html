<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glug — Your Fun Wine Wingman</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #1a0e1e;
      --bg-card: #261a2e;
      --gold: #d4a44c;
      --gold-light: #f0cd7e;
      --gold-dim: #a37a30;
      --text: #f0e6d3;
      --text-muted: #a89b8c;
      --wine: #6b1d3a;
      --wine-light: #8e2a50;
      --error: #c0392b;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Screens ── */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: 2rem 1.5rem;
      flex: 1;
    }

    .screen.active {
      display: flex;
    }

    /* ── Landing ── */
    #landing {
      justify-content: center;
      text-align: center;
      gap: 1.5rem;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 5rem;
      color: var(--gold);
      letter-spacing: -2px;
      line-height: 1;
    }

    .tagline {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.5;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      border: none;
      border-radius: 60px;
      padding: 1rem 2rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(212, 164, 76, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
    }

    .btn-secondary:hover {
      background: rgba(212, 164, 76, 0.1);
    }

    .btn-icon {
      font-size: 1.3rem;
    }

    /* ── File Input ── */
    #photoInput {
      display: none;
    }

    /* ── Loading ── */
    #loading {
      justify-content: center;
      text-align: center;
      gap: 2rem;
    }

    .spinner {
      width: 64px;
      height: 64px;
      animation: spin 2.5s ease-in-out infinite;
      font-size: 3.5rem;
      line-height: 64px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(180deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.25rem;
      color: var(--gold-light);
      font-weight: 500;
    }

    .loading-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ── Result ── */
    #result {
      justify-content: flex-start;
      padding-top: 3rem;
      gap: 1.5rem;
    }

    .result-header {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--gold);
      text-align: center;
    }

    .result-card {
      background: var(--bg-card);
      border: 1px solid rgba(212, 164, 76, 0.2);
      border-radius: 20px;
      padding: 1.75rem;
      width: 100%;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.6s ease forwards;
    }

    .result-card:nth-child(2) { animation-delay: 0.1s; }
    .result-card:nth-child(3) { animation-delay: 0.25s; }
    .result-card:nth-child(4) { animation-delay: 0.4s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wine-name {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--gold-light);
      margin-bottom: 0.5rem;
    }

    .wine-meta {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .price-compare {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin: 0.8rem 0;
      font-size: 0.95rem;
    }
    .price-compare .price-tag {
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
    }
    .price-compare .price-tag.retail {
      color: var(--gold);
    }
    .price-compare .price-tag.restaurant {
      color: var(--muted);
    }

    .wine-explanation {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--text);
    }

    .pairing-label {
      font-weight: 700;
      color: var(--gold);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
    }

    .pairing-text {
      font-size: 1rem;
      color: var(--text);
      line-height: 1.5;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      align-items: center;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.55s forwards;
    }

    /* ── Error ── */
    #error {
      justify-content: center;
      text-align: center;
      gap: 1.5rem;
    }

    .error-icon {
      font-size: 3rem;
    }

    .error-msg {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 320px;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- Landing Screen -->
  <div class="screen active" id="landing">
    <div class="logo">Glug</div>
    <p class="tagline">Snap a wine list. Get the best pick. Zero pretension.</p>
    <button class="btn" id="snapBtn">
      <span class="btn-icon">📸</span> Snap your wine list
    </button>
    <input type="file" id="photoInput" accept="image/*" capture="environment">
  </div>

  <!-- Loading Screen -->
  <div class="screen" id="loading">
    <div class="spinner">🍷</div>
    <div class="loading-text">Swirling the glass&hellip;</div>
    <div class="loading-sub">Reading the wine list &amp; picking a winner</div>
  </div>

  <!-- Result Screen -->
  <div class="screen" id="result">
    <div class="result-header">We'd go with&hellip;</div>
    <div class="result-card">
      <div class="wine-name" id="wineName"></div>
      <div class="wine-meta" id="wineMeta"></div>
      <div class="price-compare" id="priceCompare"></div>
      <div class="wine-explanation" id="wineExplanation"></div>
    </div>
    <div class="result-card">
      <div class="pairing-label">Pairs great with</div>
      <div class="pairing-text" id="foodPairing"></div>
    </div>
    <div class="result-actions">
      <button class="btn" id="tryAnotherBtn">
        <span class="btn-icon">📸</span> Try another list
      </button>
    </div>
  </div>

  <!-- Error Screen -->
  <div class="screen" id="error">
    <div class="error-icon">😬</div>
    <div class="error-msg" id="errorMsg">Something went wrong. Maybe the photo was blurry, or the wine list was in ancient Sumerian.</div>
    <button class="btn btn-secondary" id="errorRetryBtn">Try again</button>
  </div>

  <div class="footer">Glug &mdash; Your fun wine wingman</div>

  <script>
    // ── State ──
    const $ = (sel) => document.querySelector(sel);

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(`#${id}`).classList.add('active');
    }

    // ── Config ──
    const WORKER_URL = 'https://glug-api.bruhs.workers.dev';

    // ── Photo handling ──
    const MAX_IMAGE_BYTES = 4 * 1024 * 1024; // 4MB to stay safely under 5MB API limit

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          const base64 = dataUrl.split(',')[1];
          if (atob(base64).length <= MAX_IMAGE_BYTES) {
            return resolve({ base64, mediaType: file.type || 'image/jpeg' });
          }
          resizeImage(dataUrl).then(resolve).catch(reject);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function resizeImage(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let { width, height } = img;
          const scale = Math.min(1, 1568 / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const resized = canvas.toDataURL('image/jpeg', 0.8);
          const base64 = resized.split(',')[1];
          resolve({ base64, mediaType: 'image/jpeg' });
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    // ── API Call ──
    async function analyzeWineList(base64, mediaType) {
      const prompt = `You are a fun, knowledgeable wine buddy — not a stuffy sommelier. Look at this photo of a wine list from a restaurant.

Your job:
1. Identify the wines on the list with their restaurant prices.
2. For each wine, estimate what it typically costs at a supermarket or retail store based on your knowledge.
3. Pick the single BEST bang-for-the-buck bottle — the one with the lowest markup compared to its retail price.
4. Explain your pick in 2–3 casual, fun sentences. Mention the markup so the user knows they're getting a deal. No wine jargon — talk like a cool friend who knows their stuff.
5. Suggest one food pairing in a single line.

Respond in EXACTLY this JSON format and nothing else:
{
  "name": "Wine Name",
  "grape": "Grape variety (or blend)",
  "region": "Region, Country",
  "restaurant_price": "$XX",
  "retail_price": "~$XX",
  "explanation": "Your 2-3 sentence casual explanation mentioning the value.",
  "pairing": "Your one-line food pairing suggestion."
}

If you can't read the wine list clearly, respond with:
{ "error": "Couldn't make out the wine list — try a clearer photo!" }`;

      const resp = await fetch(WORKER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: 'claude-opus-4-7',
          max_tokens: 1024,
          messages: [{
            role: 'user',
            content: [
              {
                type: 'image',
                source: {
                  type: 'base64',
                  media_type: mediaType,
                  data: base64
                }
              },
              {
                type: 'text',
                text: prompt
              }
            ]
          }]
        })
      });

      if (!resp.ok) {
        const errBody = await resp.text();
        throw new Error(`API error (${resp.status}): ${errBody}`);
      }

      const data = await resp.json();
      const text = data.content[0].text;

      // Extract JSON from the response (handle markdown code blocks)
      const jsonMatch = text.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error('Unexpected response format.');

      const result = JSON.parse(jsonMatch[0]);
      if (result.error) throw new Error(result.error);

      return result;
    }

    // ── Display result ──
    function displayResult(wine) {
      $('#wineName').textContent = wine.name;
      $('#wineMeta').textContent = [wine.grape, wine.region].filter(Boolean).join(' · ');
      const priceEl = $('#priceCompare');
      if (wine.restaurant_price && wine.retail_price) {
        priceEl.innerHTML =
          `<span class="price-tag restaurant">Menu: ${wine.restaurant_price}</span>` +
          `<span class="price-tag retail">Retail: ${wine.retail_price}</span>`;
      } else {
        priceEl.innerHTML = '';
      }
      $('#wineExplanation').textContent = wine.explanation;
      $('#foodPairing').textContent = wine.pairing;
      showScreen('result');
    }

    function showError(msg) {
      $('#errorMsg').textContent = msg || "Something went wrong. Maybe the photo was blurry, or the wine list was in ancient Sumerian.";
      showScreen('error');
    }

    // ── Main flow ──
    async function handlePhoto(file) {
      showScreen('loading');
      try {
        const { base64, mediaType } = await fileToBase64(file);
        const wine = await analyzeWineList(base64, mediaType);
        displayResult(wine);
      } catch (err) {
        console.error(err);
        showError(err.message);
      }
    }

    // ── Event listeners ──
    $('#snapBtn').addEventListener('click', () => {
      $('#photoInput').click();
    });

    $('#photoInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handlePhoto(file);
      e.target.value = '';
    });

    $('#tryAnotherBtn').addEventListener('click', () => {
      showScreen('landing');
      $('#photoInput').click();
    });

    $('#errorRetryBtn').addEventListener('click', () => {
      showScreen('landing');
    });
  </script>
</body>
</html>
